<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | むめいよわよわ</title>
    
    <link rel="stylesheet" href="photobooth.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;500;700&display=swap" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>
    <script src="slideshow.js"></script>
</head>
<body>

    <header class="site-header">
        <div class="header-content">
            <div class="title"><span>むめいよわよわ</span></div>
            <nav>
                <ul>
                    <li><a href="index.html">Top Page</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="slideshow">
            <div class="slideshow-inner">
                <div class="slides">
                    <div class="slide is-active">
                        <div class="slide-content">
                            <div class="caption">
                                <div class="title">Vertical Collection</div>
                                <a href="#VRChat-photo" class="btn">
                                    <span class="btn-inner">View More</span>
                                </a>
                            </div>
                        </div>
                        <div class="image-container"> 
                            <img src="image/yoko_photo1.jpg" alt="">
                        </div>
                    </div>
                    <div class="slide">
                        <div class="slide-content">
                            <div class="caption">
                                <div class="title">Landscape Collection</div>
                                <a href="#photo-gallery-yoko" class="btn">
                                    <span class="btn-inner">View More</span>
                                </a>
                            </div>
                        </div>
                        <div class="image-container">
                            <img src="image/yoko_photo2.png" alt="">
                        </div>
                    </div>
                    <div class="slide">
                        <div class="slide-content">
                            <div class="caption">
                                <div class="title">Mumei Yowayowa</div>
                                <a href="#" class="btn"><span class="btn-inner">Profile</span></a>
                            </div>
                        </div>
                        <div class="image-container">
                            <img src="image/profile.jpg" alt="">
                        </div>
                    </div>
                    <div class="slide">
                        <div class="slide-content">
                            <div class="caption">
                                <div class="title">VRChat Life</div>
                            </div>
                        </div>
                        <div class="image-container"> 
                            <img src="image/main_visual.png" alt="">
                        </div>
                    </div>
                </div>
                
            </div> 
        </section>

     <section class="photo-gallery-section" id="VRChat-photo">
    <h1 class="section-title">Gallery</h1>
    
    <h2>縦画像 (Vertical)</h2>
    <div id="gallery-vertical" class="gallery-grid vertical"></div>

    <h2>横画像 (Landscape)</h2>
    <div id="gallery-landscape" class="gallery-grid"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>
<script src="slideshow.js"></script>
<script src="gallery.js"></script>
    </main>

    <script>
        lightbox.option({
            'resizeDuration': 200,
            'wrapAround': true,
            'fadeDuration': 300
        })
    </script>
</body>
</html>
