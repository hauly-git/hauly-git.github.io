<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | むめいよわよわ</title>
    
    <link rel="stylesheet" href="photobooth.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;500;700&display=swap" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js"></script>

    <script src="slideshow.js"></script>
</head>
<body>

    <header class="site-header">
        <div class="header-content">
            <div class="title"><span>むめいよわよわ</span></div>
            <nav>
                <ul>
                    <li><a href="index.html">Top Page</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="slideshow">
            <div class="slideshow-inner">
                <div class="slides">
                    <div class="slide is-active">
                        <div class="slide-content">
                            <div class="caption">
                                <div class="title">Vertical Collection</div>
                                <a href="#VRChat-photo" class="btn">
                                    <span class="btn-inner">View More</span>
                                </a>
                            </div>
                        </div>
                        <div class="image-container"> 
                            <img src="image/yoko_photo1.jpg" alt="">
                        </div>
                    </div>
                    <div class="slide">
                        <div class="slide-content">
                            <div class="caption">
                                <div class="title">Landscape Collection</div>
                                <a href="#photo-gallery-yoko" class="btn">
                                    <span class="btn-inner">View More</span>
                                </a>
                            </div>
                        </div>
                        <div class="image-container">
                            <img src="image/yoko_photo2.png" alt="">
                        </div>
                    </div>
                    <div class="slide">
                        <div class="slide-content">
                            <div class="caption">
                                <div class="title">Mumei Yowayowa</div>
                                <a href="#" class="btn"><span class="btn-inner">Profile</span></a>
                            </div>
                        </div>
                        <div class="image-container">
                            <img src="image/profile.jpg" alt="">
                        </div>
                    </div>
                    <div class="slide">
                        <div class="slide-content">
                            <div class="caption">
                                <div class="title">VRChat Life</div>
                            </div>
                        </div>
                        <div class="image-container"> 
                            <img src="image/main_visual.png" alt="">
                        </div>
                    </div>
                </div>
                
                <div class="arrows">
                    <div class="arrow prev">
                        <svg viewBox="0 0 14 26" width="14" height="26"><path d="M13,26c-0.256,0-0.512-0.098-0.707-0.293l-12-12c-0.391-0.391-0.391-1.023,0-1.414l12-12c0.391-0.391,1.023-0.391,1.414,0s0.391,1.023,0,1.414L2.414,13l11.293,11.293c0.391,0.391,0.391,1.023,0,1.414C13.512,25.902,13.256,26,13,26z"/></svg>
                    </div>
                    <div class="arrow next">
                        <svg viewBox="0 0 14 26" width="14" height="26"><path d="M1,0c0.256,0,0.512,0.098,0.707,0.293l12,12c0.391,0.391,0.391,1.023,0,1.414l-12,12c-0.391,0.391-1.023,0.391-1.414,0s-0.391-1.023,0-1.414L11.586,13L0.293,1.707c-0.391-0.391-0.391-1.023,0-1.414C0.488,0.098,0.744,0,1,0z"/></svg>
                    </div>
                </div>
            </div> 
        </section>
