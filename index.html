<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>むめいよわよわ | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <div class="title"><span>むめいよわよわ</span></div>
            <nav>
                <ul>
                    <li><a href="#about">About</a></li>
                    <li><a href="#photo-collection"><i class="fa-solid fa-camera-alt"></i>Photo</a></li>
                    <li><a href="#booth-shop"><i class="fa-solid fa-store-alt"></i>Shop</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="main-visual">
        <h1>Mumei Yowayowa</h1>
    </div>

    <main>
        <section id="about">
            <div class="about-container">
                <img src="image/profile.jpg" alt="Profile Image" class="profile-image">
                <div class="about-text">
                    <h2 class="sentence"><span>むめいよわよわ</span></h2>
                    <p>こんにちは！</p>
                    <p>むめいよわよわです。</p>
                    <p>Blenderで3Dモデリングをしたり、VRChatで遊んだりしています。</p>
                    <p>最近はVRC内で写真を撮るので、撮った写真をこのサイトで紹介しています。</p>
                </div>
            </div>
        </section>

        <section id="photo-collection">
            <h2>撮った写真集</h2>
            <p style="margin-bottom: 30px;">VRChatの世界で撮影したお気に入りの一枚たちです。</p>
            <a href="photobooth.html" class="btn-link">ギャラリーを見る <i class="fa-solid fa-arrow-right"></i></a>
        </section>

        <section id="booth-shop">
            <h2>BOOTH SHOP</h2>
            <p class="booth-shop-to-link">3Dモデルやアイテムはこちらで販売中</p>
            <a href="https://yowayowa-shop.booth.pm/">
                <img src="image/boothicon.png" alt="boothショップへのリンク" class="booth-image">
            </a>
        </section>
    </main>
</body>
</html>
